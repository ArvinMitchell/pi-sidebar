name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tag 版本号必须与 manifest.json / bridge/package.json 一致，防止发错版
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          EXT_VER=$(node -p "require('./extension/manifest.json').version")
          BRIDGE_VER=$(node -p "require('./bridge/package.json').version")
          if [ "$TAG" != "$EXT_VER" ] || [ "$TAG" != "$BRIDGE_VER" ]; then
            echo "❌ 版本不一致: tag=$TAG, extension=$EXT_VER, bridge=$BRIDGE_VER"
            exit 1
          fi
          echo "✅ 版本一致: $TAG"

      - name: Package Chrome extension
        run: |
          mkdir -p dist
          cd extension
          zip -qr "../dist/pi-sidebar-extension-${GITHUB_REF_NAME}.zip" . -x ".DS_Store"

      - name: Package bridge (with production deps)
        run: |
          mkdir -p dist/pi-sidebar-bridge
          cp bridge/bridge.mjs bridge/pi-browser-tools.ts bridge/SKILL.md bridge/package.json bridge/package-lock.json dist/pi-sidebar-bridge/
          cd dist/pi-sidebar-bridge
          npm ci --omit=dev --no-fund --no-audit
          cd ..
          zip -qr "pi-sidebar-bridge-${GITHUB_REF_NAME}.zip" pi-sidebar-bridge -x "*/.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pi-sidebar-extension-*.zip
            dist/pi-sidebar-bridge-*.zip
          generate_release_notes: true
